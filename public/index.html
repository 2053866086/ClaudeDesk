<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeDesk</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/hl-light.css" id="hl-light">
<link rel="stylesheet" href="vendor/hl-dark.css" id="hl-dark" disabled>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar" aria-label="对话列表">
    <div class="side-top">
      <button class="icon-btn" id="btn-collapse" title="收起侧栏" aria-label="收起侧栏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <span class="brand"><img src="icon.svg" alt="" width="20" height="20">ClaudeDesk</span>
    </div>
    <button class="new-chat" id="btn-new">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新对话<kbd>Ctrl+Shift+O</kbd>
    </button>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input id="search" type="search" placeholder="搜索对话" aria-label="搜索对话">
    </label>
    <nav id="conv-list"></nav>
    <div class="side-foot">
      <span id="conn" class="conn"><i></i><span id="conn-text">连接中</span></span>
      <button class="icon-btn" id="btn-settings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </aside>
  <div id="scrim" hidden></div>

  <main id="main" class="empty">
    <header id="topbar">
      <button class="icon-btn" id="btn-expand" title="展开侧栏" aria-label="展开侧栏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
      <label class="model-pick" title="选择模型">
        <select id="model" aria-label="模型"></select>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </label>
      <h1 id="conv-title"></h1>
      <div class="usage-wrap">
        <button type="button" id="usage" class="usage" aria-expanded="false" aria-controls="usage-pop" title="token 用量" hidden>
          <span class="meter"><i id="usage-bar"></i></span><span id="usage-text"></span>
        </button>
        <div id="usage-pop" class="usage-pop" role="dialog" aria-label="token 用量" hidden></div>
      </div>
    </header>

    <section id="messages" aria-live="polite"></section>

    <div id="welcome">
      <img src="icon.svg" alt="" width="40" height="40">
      <h2 id="greeting">你好</h2>
      <p id="welcome-sub"></p>
    </div>

    <form id="composer" autocomplete="off">
      <div id="edit-bar" hidden><span>正在编辑一条消息，发送后会替换它和后面的回复</span><button type="button" id="edit-cancel">取消</button></div>
      <div id="attachments"></div>
      <textarea id="input" rows="1" placeholder="给 Claude 发消息，Enter 发送，Shift+Enter 换行" aria-label="消息"></textarea>
      <div class="composer-row">
        <button type="button" class="icon-btn" id="btn-attach" title="添加图片或文件" aria-label="添加图片或文件">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 11.5-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>
        </button>
        <input type="file" id="file" multiple hidden>
        <label class="toggle" title="让模型先思考再回答，更慢但更仔细">
          <input type="checkbox" id="thinking"><span class="track"></span>深度思考
        </label>
        <label class="effort-pick" title="推理强度（effort）：越高越仔细，也越慢、越费 token。不是所有模型都支持">
          <span>强度</span>
          <select id="effort" aria-label="推理强度">
            <option value="">默认</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
            <option value="xhigh">很高</option>
            <option value="max">最高</option>
          </select>
        </label>
        <span class="spacer"></span>
        <button type="submit" id="btn-send" class="send" aria-label="发送" disabled>
          <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        </button>
      </div>
    </form>
    <p class="footnote">回复由 AI 生成，可能有错，重要内容请核实。</p>
  </main>
</div>

<div id="drop" hidden><div>松开鼠标添加文件</div></div>
<div id="toast" role="status" hidden></div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h3>设置</h3>
    <label>系统提示词<span class="hint">每个对话都会带上，比如"用中文回答"</span>
      <textarea name="systemPrompt" rows="5"></textarea>
    </label>
    <div class="grid">
      <label>默认模型<select name="defaultModel"></select></label>
      <label>主题
        <select name="theme"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
      </label>
      <label>最大输出 token<input name="maxTokens" type="number" min="256" max="128000" step="256"></label>
      <label>思考预算 token<input name="thinkingBudget" type="number" min="1024" max="64000" step="1024"></label>
    </div>
    <fieldset class="import-box">
      <legend>历史记录</legend>
      <label class="check"><input type="checkbox" name="autoImport">自动导入 Claude Code 的会话记录<span class="hint">启动时导入，之后每 5 分钟检查一次新内容</span></label>
      <div class="import-row">
        <span id="import-status" class="hint"></span>
        <button type="button" class="btn" id="btn-import">立即导入</button>
      </div>
    </fieldset>
    <p class="conn-info" id="conn-info"></p>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate class="btn">取消</button>
      <button value="save" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
